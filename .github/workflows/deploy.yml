# Deploy website KGP (static) ke GitHub Pages + custom domain
# Custom domain dibaca otomatis dari file CNAME di root repo.
name: Deploy KGP ke GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload file website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
